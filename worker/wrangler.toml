name = "dallas-re-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Keep any variables you set in the Cloudflare dashboard when deploying from here.
keep_vars = true

[vars]
# Claude model ID. Check https://docs.claude.com/en/docs/about-claude/models for current IDs.
MODEL = "claude-sonnet-5-5"
# Where the website lives (GitHub Pages URL or your custom domain). The Worker reads /data/*.json from here.
SITE_URL = "https://dallasrealestateinternet.com/"
# Comma-separated list of sites allowed to call this Worker.
# capacitor://localhost and https://localhost are the DFW Homes iPhone and Android apps.
ALLOWED_ORIGINS = "https://kohlklaus8.github.io,https://dallasrealestateinternet.com,https://www.dallasrealestateinternet.com,capacitor://localhost,https://localhost"
WEB_SEARCH = "on"
# Home search (NTREIS VOW). Defaults in code are the strict VOW settings, so these are optional:
#   VOW_GATE "sold" = only sold data needs an account (IDX + VOW); VOW_VERIFY "on" = email must be confirmed first;
#   VOW_ACCESS_DAYS "180" = re-accept the terms every 180 days; FEED_OPTOUT "on" = honor seller opt-outs.
VOW_TERMS_VERSION = "2026-11-02"
WORKER_URL = "https://dallas-re-ai.klauspropertymgmt.workers.dev"
# When NTREIS sends feed credentials: uncomment and fill in the RESO Web API URL(s), then add the token(s)
# as secrets in the Cloudflare dashboard (Settings > Variables and Secrets): FEED_TOKEN, and SOLD_FEED_TOKEN
# if the VOW (sold) feed has its own login. Set SOLD_FEED_URL only if the VOW feed has a separate URL.
# FEED_URL = "https://api.your-vendor.com/reso/odata"
# FEED_MAX = "350"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   ANTHROPIC_API_KEY
#   LEAD_WEBHOOK   (optional)

# ---------- Home search: account store ----------
# Account store (created Oct 25, 2026).
[[kv_namespaces]]
binding = "VOW"
id = "b3926d2a54e543e898397107c72ca54a"

# Daily alert emails at about 8 a.m. Central (13:07 UTC). Does nothing until the feed is connected.
[triggers]
crons = ["7 13 * * *"]
